<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FreelanceGuard</title>
  <script>
    (function() {
      var base = '/freelanceguard-frontend';
      var currentPath = window.location.pathname;
      // Remove the base from the path if it's already there (avoids double basename)
      var pathWithoutBase = currentPath.replace(new RegExp('^' + base), '');
      var newURL = base + pathWithoutBase + window.location.search + window.location.hash;
      window.location.replace(newURL);
    })();
  </script>
</head>
<body></body>
</html>
