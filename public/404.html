<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FreelanceGuard</title>
  <script>
    // Redirect to the app while keeping the original path
    (function() {
      var base = '/freelanceguard-frontend';
      var fullPath = window.location.pathname;
      // If the path already starts with the base, don't double it
      if (fullPath.startsWith(base)) {
        // Remove base from the beginning, then rebuild
        var subPath = fullPath.substring(base.length);
        window.location.replace(base + subPath + window.location.search + window.location.hash);
      } else {
        // Path doesn't contain base, so add it
        window.location.replace(base + fullPath + window.location.search + window.location.hash);
      }
    })();
  </script>
</head>
<body></body>
</html>
